<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArbiFlow</title><style>body{font-family:system-ui;background:#0b1020;color:#eef2ff;margin:0}main{max-width:900px;margin:auto;padding:30px}.card{background:#11182c;border:1px solid #26304b;border-radius:16px;padding:20px;margin:16px 0}input,button{padding:12px;margin:5px;border-radius:8px;border:1px solid #34415f;background:#0e1528;color:white}button{cursor:pointer}.muted{color:#9aa6c5}pre{white-space:pre-wrap}</style></head><body><main><h1>ArbiFlow</h1><p class="muted">Real deposit backend foundation</p><div class="card"><h2>Register / Login</h2><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="register()">Register</button><button onclick="login()">Login</button><pre id="auth"></pre></div><div class="card"><h2>My balances</h2><button onclick="loadBalance()">Refresh</button><pre id="bal">Login first.</pre></div><div class="card"><h2>Deposit addresses</h2><pre id="addr">Login first.</pre></div><div class="card"><h2>Deposits</h2><pre id="deps">Login first.</pre></div></main><script>let token=localStorage.token;async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body)opt.headers['Content-Type']='application/json';let r=await fetch(url,opt);let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function register(){try{let d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});token=d.token;localStorage.token=token;auth.textContent='Registered and logged in';loadAll()}catch(e){auth.textContent=e.message}}async function login(){try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});token=d.token;localStorage.token=token;auth.textContent='Logged in';loadAll()}catch(e){auth.textContent=e.message}}async function loadBalance(){try{bal.textContent=JSON.stringify(await api('/api/balance'),null,2)}catch(e){bal.textContent=e.message}}async function loadAll(){try{addr.textContent=JSON.stringify(await api('/api/deposits/addresses'),null,2);deps.textContent=JSON.stringify(await api('/api/deposits'),null,2);loadBalance()}catch(e){auth.textContent=e.message}}if(token)loadAll()</script></body></html>
